name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

# Default to a read-only token; only the jobs that publish (docker-publish,
# release) request write scopes, and both only run for v* tags after tests pass.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Gate: tagged releases (images + GitHub Release) never publish unless tests pass.
  # ci.yml runs the full Python matrix; one leg is enough to gate here.
  test:
    name: 🧪 Pytest
    uses: ./.github/workflows/pytest.yml
    with:
      python-versions: '["3.12"]'

  build:
    name: 📦 Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0~dev.$(date +%Y%m%d%H%M%S)+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Prepare package layout
        run: |
          mkdir -p build/pkg/opt/cdi-health/pkg
          mkdir -p build/pkg/usr/local/bin

          cp dist/cdi_health-*.whl build/pkg/opt/cdi-health/pkg/

          # Lock runtime deps from a clean venv so .deb postinst installs are reproducible.
          python -m venv /tmp/cdi-lock-venv
          /tmp/cdi-lock-venv/bin/pip install --upgrade pip
          /tmp/cdi-lock-venv/bin/pip install "$(ls dist/cdi_health-*.whl)[api]"
          # Filter the project itself in every form pip freeze can emit:
          # "cdi-health==x", "cdi_health==x", "cdi-health @ file://...", "cdi_health @ file://..."
          /tmp/cdi-lock-venv/bin/pip freeze \
            | grep -v -E '^cdi[-_]health(==| @)' \
            > build/pkg/opt/cdi-health/pkg/requirements-lock.txt
          test -s build/pkg/opt/cdi-health/pkg/requirements-lock.txt

          cat > build/pkg/usr/local/bin/cdi-health << 'WRAPPER'
          #!/bin/sh
          exec /opt/cdi-health/bin/cdi-health-wrapper.sh -m cdi_health "$@"
          WRAPPER
          chmod +x build/pkg/usr/local/bin/cdi-health

          cat > build/pkg/usr/local/bin/cdi-health-api << 'WRAPPER'
          #!/bin/sh
          exec /opt/cdi-health/bin/cdi-health-wrapper.sh -m cdi_health.api.server "$@"
          WRAPPER
          chmod +x build/pkg/usr/local/bin/cdi-health-api

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm pkg --packager deb --target dist/

      - name: Build rpm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm pkg --packager rpm --target dist/

      - name: Verify OS package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -lah dist/
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            package_version="${VERSION}"
            if [[ "${package_version}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              package_version="${package_version}.0"
            fi
            test -f "dist/cdi-health_${package_version}_all.deb"
            test -f "dist/cdi-health-${package_version}-1.noarch.rpm"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  deb-smoke:
    name: 🧪 .deb install (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # System python3: 3.10 (Jammy) and 3.11 (Bookworm), the oldest runtimes we ship to.
        image: ["ubuntu:22.04", "debian:bookworm"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/

      - name: Install, run, and remove the .deb
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$IMAGE" \
            bash scripts/deb-smoke-test.sh "$(ls dist/cdi-health_*_all.deb)"

  # PRs / branches / manual runs: build amd64 images locally and smoke-run them.
  docker-ci:
    name: 🐳 Build Docker images
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0.dev0
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/circulardrives/cdi-health-api:ci
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=cdi-health-api
          cache-to: type=gha,mode=max,scope=cdi-health-api

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/circulardrives/cdi-health-dashboard:ci
          build-args: |
            VITE_APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=cdi-health-dashboard
          cache-to: type=gha,mode=max,scope=cdi-health-dashboard

      - name: Smoke-run API image
        run: |
          docker run -d --name cdi-api-smoke -p 127.0.0.1:8844:8844 \
            -e CDI_HEALTH_API_TOKEN=ci-smoke-token \
            ghcr.io/circulardrives/cdi-health-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8844/api/v1/health; then
              echo
              docker rm -f cdi-api-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::API container did not become healthy within 30s"
          docker logs cdi-api-smoke
          exit 1

  # Tagged releases only: multi-arch build + push to GHCR, gated on tests and
  # the .deb install test so a broken tag never publishes images.
  docker-publish:
    name: 🐳 Publish Docker images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, build, deb-smoke]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/circulardrives/cdi-health-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push API image
        id: push-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cdi-health-api
          cache-to: type=gha,mode=max,scope=cdi-health-api

      - name: Attest API image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/circulardrives/cdi-health-api
          subject-digest: ${{ steps.push-api.outputs.digest }}
          push-to-registry: true

      - name: Docker metadata (dashboard)
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/circulardrives/cdi-health-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push dashboard image
        id: push-dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cdi-health-dashboard
          cache-to: type=gha,mode=max,scope=cdi-health-dashboard

      - name: Attest dashboard image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/circulardrives/cdi-health-dashboard
          subject-digest: ${{ steps.push-dashboard.outputs.digest }}
          push-to-registry: true

      - name: Set GHCR package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in cdi-health-api cdi-health-dashboard; do
            echo "Setting ${pkg} visibility to public..."
            gh api --method PATCH "/orgs/circulardrives/packages/container/${pkg}" \
              -f visibility=public \
              -H "X-GitHub-Api-Version: 2022-11-28"
          done

  release:
    name: 🚀 Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, build, deb-smoke, docker-publish]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.whl *.tar.gz *.deb *.rpm > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/cdi*

      - name: Prepare container release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Container images"
            echo
            echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`) images are published to GHCR:"
            echo
            echo "- \`ghcr.io/circulardrives/cdi-health-api:${version}\`"
            echo "- \`ghcr.io/circulardrives/cdi-health-dashboard:${version}\`"
            echo
            echo '```bash'
            echo "CDI_VERSION=${version} ./scripts/docker-up.sh"
            echo "# or pin remotely:"
            echo "CDI_VERSION=${version} ./scripts/docker-up.sh --bench <bench-ip>"
            echo '```'
            echo
            echo "## Verify downloads"
            echo
            echo '```bash'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify cdi-health_${version}_all.deb --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > "$RUNNER_TEMP/release-containers.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: ${{ runner.temp }}/release-containers.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
