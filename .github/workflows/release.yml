name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 📦 Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0~dev.$(date +%Y%m%d%H%M%S)+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Prepare package layout
        run: |
          mkdir -p build/pkg/opt/cdi-health/lib
          mkdir -p build/pkg/usr/local/bin

          # Include [api] extras so cdi-health-api can import fastapi/uvicorn/pydantic.
          pip install --target=build/pkg/opt/cdi-health/lib "$(ls dist/*.whl)[api]"

          # Remove __pycache__ dirs to avoid bloating the package
          find build/pkg -type d -name __pycache__ -prune -exec rm -rf {} +

          cat > build/pkg/usr/local/bin/cdi-health << 'WRAPPER'
          #!/bin/sh
          export PYTHONPATH=/opt/cdi-health/lib
          exec python3 -m cdi_health "$@"
          WRAPPER
          chmod +x build/pkg/usr/local/bin/cdi-health

          cat > build/pkg/usr/local/bin/cdi-health-api << 'WRAPPER'
          #!/bin/sh
          export PYTHONPATH=/opt/cdi-health/lib
          exec python3 -c "from cdi_health.api.server import main; main()" "$@"
          WRAPPER
          chmod +x build/pkg/usr/local/bin/cdi-health-api

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm pkg --packager deb --target dist/

      - name: Build rpm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm pkg --packager rpm --target dist/

      - name: Verify OS package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -lah dist/
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            package_version="${VERSION}"
            if [[ "${package_version}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              package_version="${package_version}.0"
            fi
            test -f "dist/cdi-health_${package_version}_all.deb"
            test -f "dist/cdi-health-${package_version}-1.noarch.rpm"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  docker:
    name: 🐳 Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (API)
        if: steps.version.outputs.push == 'true'
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cdi-health-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push API image (release)
        if: steps.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cdi-health-api
          cache-to: type=gha,mode=max,scope=cdi-health-api

      - name: Build API image (CI)
        if: steps.version.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/cdi-health-api:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cdi-health-api
          cache-to: type=gha,mode=max,scope=cdi-health-api

      - name: Docker metadata (dashboard)
        if: steps.version.outputs.push == 'true'
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/cdi-health-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push dashboard image (release)
        if: steps.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha,scope=cdi-health-dashboard
          cache-to: type=gha,mode=max,scope=cdi-health-dashboard

      - name: Build dashboard image (CI)
        if: steps.version.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/cdi-health-dashboard:ci
          cache-from: type=gha,scope=cdi-health-dashboard
          cache-to: type=gha,mode=max,scope=cdi-health-dashboard

      - name: Verify API image (CI)
        if: steps.version.outputs.push != 'true'
        run: |
          docker run --rm ghcr.io/${{ github.repository }}/cdi-health-api:ci \
            python -c "import cdi_health; import fastapi; print('ok')"

  release:
    name: 🚀 Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: dist/

      - name: Prepare container release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Container images"
            echo
            echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`) images are published to GHCR:"
            echo
            echo "- \`ghcr.io/${{ github.repository }}/cdi-health-api:${version}\`"
            echo "- \`ghcr.io/${{ github.repository }}/cdi-health-dashboard:${version}\`"
            echo
            echo '```bash'
            echo "docker compose -f deploy/docker/docker-compose.ghcr.yml up -d"
            echo "# or pin this release:"
            echo "CDI_VERSION=${version} docker compose -f deploy/docker/docker-compose.ghcr.yml up -d"
            echo '```'
          } > "$RUNNER_TEMP/release-containers.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: ${{ runner.temp }}/release-containers.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
