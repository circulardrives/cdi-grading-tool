name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 📦 Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0~dev.$(date +%Y%m%d%H%M%S)+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Prepare package layout
        run: |
          mkdir -p build/pkg/opt/cdi-health/pkg
          mkdir -p build/pkg/usr/local/bin

          cp dist/cdi_health-*.whl build/pkg/opt/cdi-health/pkg/

          # Lock runtime deps from a clean venv so .deb postinst installs are reproducible.
          python -m venv /tmp/cdi-lock-venv
          /tmp/cdi-lock-venv/bin/pip install --upgrade pip
          /tmp/cdi-lock-venv/bin/pip install "$(ls dist/cdi_health-*.whl)[api]"
          /tmp/cdi-lock-venv/bin/pip freeze \
            | grep -v -E '^(cdi-health|cdi_health)==' \
            | grep -v -E '^cdi-health @' \
            > build/pkg/opt/cdi-health/pkg/requirements-lock.txt
          test -s build/pkg/opt/cdi-health/pkg/requirements-lock.txt

          cat > build/pkg/usr/local/bin/cdi-health << 'WRAPPER'
          #!/bin/sh
          exec /opt/cdi-health/bin/cdi-health-wrapper.sh -m cdi_health "$@"
          WRAPPER
          chmod +x build/pkg/usr/local/bin/cdi-health

          cat > build/pkg/usr/local/bin/cdi-health-api << 'WRAPPER'
          #!/bin/sh
          exec /opt/cdi-health/bin/cdi-health-wrapper.sh -m cdi_health.api.server "$@"
          WRAPPER
          chmod +x build/pkg/usr/local/bin/cdi-health-api

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm pkg --packager deb --target dist/

      - name: Build rpm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nfpm pkg --packager rpm --target dist/

      - name: Verify OS package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -lah dist/
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            package_version="${VERSION}"
            if [[ "${package_version}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              package_version="${package_version}.0"
            fi
            test -f "dist/cdi-health_${package_version}_all.deb"
            test -f "dist/cdi-health-${package_version}-1.noarch.rpm"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  docker:
    name: 🐳 Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.9.0.dev0" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (API)
        if: steps.version.outputs.push == 'true'
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/circulardrives/cdi-health-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push API image (release)
        if: steps.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cdi-health-api
          cache-to: type=gha,mode=max,scope=cdi-health-api

      - name: Build API image (CI)
        if: steps.version.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/circulardrives/cdi-health-api:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=cdi-health-api
          cache-to: type=gha,mode=max,scope=cdi-health-api

      - name: Docker metadata (dashboard)
        if: steps.version.outputs.push == 'true'
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/circulardrives/cdi-health-dashboard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push dashboard image (release)
        if: steps.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}
          cache-from: type=gha,scope=cdi-health-dashboard
          cache-to: type=gha,mode=max,scope=cdi-health-dashboard

      - name: Build dashboard image (CI)
        if: steps.version.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.dashboard
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/circulardrives/cdi-health-dashboard:ci
          cache-from: type=gha,scope=cdi-health-dashboard
          cache-to: type=gha,mode=max,scope=cdi-health-dashboard

      - name: Verify API image (CI)
        if: steps.version.outputs.push != 'true'
        run: |
          docker run --rm ghcr.io/circulardrives/cdi-health-api:ci \
            python -c "import cdi_health; import fastapi; print('ok')"

      - name: Set GHCR package visibility to public
        if: steps.version.outputs.push == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in cdi-health-api cdi-health-dashboard; do
            echo "Setting ${pkg} visibility to public..."
            gh api --method PATCH "/orgs/circulardrives/packages/container/${pkg}" \
              -f visibility=public \
              -H "X-GitHub-Api-Version: 2022-11-28"
          done

  release:
    name: 🚀 Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/

      - name: Prepare container release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Container images"
            echo
            echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`) images are published to GHCR:"
            echo
            echo "- \`ghcr.io/circulardrives/cdi-health-api:${version}\`"
            echo "- \`ghcr.io/circulardrives/cdi-health-dashboard:${version}\`"
            echo
            echo '```bash'
            echo "# mock demo:"
            echo "CDI_VERSION=${version} docker compose -f deploy/docker/docker-compose.ghcr.yml up -d"
            echo "# LAN discovery (host network API):"
            echo "CDI_VERSION=${version} docker compose -f deploy/docker/docker-compose.ghcr.yml -f deploy/docker/docker-compose.host.yml up -d"
            echo '```'
          } > "$RUNNER_TEMP/release-containers.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: ${{ runner.temp }}/release-containers.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
