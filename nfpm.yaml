# nfpm configuration for building deb and rpm packages
# https://nfpm.goreleaser.com/configuration/
#
# Usage (called by .github/workflows/release.yml):
#   VERSION=1.0.0 nfpm pkg --packager deb --target dist/
#   VERSION=1.0.0 nfpm pkg --packager rpm --target dist/

name: cdi-health
arch: all
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Circular Drive Initiative <nick.hayhurst@interactdc.com>
description: |
  CDI Health - Open Source Storage Device Grading Toolkit.
  Scan, grade, and report on storage device health using
  smartmontools, nvme-cli, and other diagnostic tools.
vendor: Circular Drive Initiative
homepage: https://github.com/circulardrives/cdi-grading-tool
license: Apache-2.0

# Common runtime deps. Debian/Ubuntu split the venv module (ensurepip) into
# python3-venv, so the deb override below adds it; RHEL/Fedora python3 ships venv.
depends:
  - python3
  - smartmontools
  - nvme-cli

recommends:
  - openseachest

contents:
  - src: ./build/pkg/opt/cdi-health/pkg
    dst: /opt/cdi-health/pkg
    type: tree

  - src: ./deploy/deb/cdi-health-wrapper.sh
    dst: /opt/cdi-health/bin/cdi-health-wrapper.sh
    file_info:
      mode: 0755

  - src: ./build/pkg/usr/local/bin/cdi-health
    dst: /usr/local/bin/cdi-health
    file_info:
      mode: 0755

  - src: ./build/pkg/usr/local/bin/cdi-health-api
    dst: /usr/local/bin/cdi-health-api
    file_info:
      mode: 0755

  - src: ./deploy/systemd/cdi-health-api.service
    dst: /usr/lib/systemd/system/cdi-health-api.service
    type: config|noreplace

  - src: ./scripts/install-host-dependencies.sh
    dst: /opt/cdi-health/scripts/install-host-dependencies.sh
    file_info:
      mode: 0755

  # Opt-in LAN exposure: examples only, never active by default. Kept out of
  # /usr/share/doc because minimal Ubuntu/Debian images path-exclude it.
  - src: ./deploy/systemd/cdi-health-api.service.d/lan.conf
    dst: /usr/share/cdi-health/examples/systemd/cdi-health-api.service.d/lan.conf
    file_info:
      mode: 0644

  - src: ./deploy/systemd/cdi-health-api.env.example
    dst: /usr/share/cdi-health/examples/cdi-health-api.env.example
    file_info:
      mode: 0644

# One set of maintainer scripts for deb and rpm; each handles both argument
# conventions (deb: configure/remove/upgrade..., rpm: numeric counts).
scripts:
  postinstall: ./deploy/deb/postinst.sh
  preremove: ./deploy/deb/prerm.sh
  postremove: ./deploy/deb/postrm.sh

overrides:
  deb:
    depends:
      - python3
      - python3-venv
      - smartmontools
      - nvme-cli
    suggests:
      - sg3-utils
  rpm:
    recommends:
      - openseachest
    suggests:
      - sg3_utils
