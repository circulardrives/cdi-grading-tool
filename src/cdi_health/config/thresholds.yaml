#
# CDI Health - Default Threshold Configuration
#
# This file contains the default thresholds used for CDI grading.
# You can customize these values by creating your own configuration file
# and passing it to the CLI with --config.
#
# When --config is omitted, the CLI loads this packaged file automatically.
#

# SMART Status
# Expected result for SMART overall health assessment
smart:
  expected_result: "Pass"
  expected_self_test_result: "Pass"

# ATA/SATA Device Thresholds
ata:
  # Maximum reallocated sectors before Grade F
  maximum_reallocated_sectors: 10

  # Maximum pending sectors before Grade F
  maximum_pending_sectors: 10

  # Maximum uncorrectable errors before Grade F
  maximum_uncorrectable_errors: 10

# NVMe Device Thresholds
# See docs/NVME_HEALTH_POLICY.md for the full Base Spec 2.3 + OCP v2.7 algorithm.
nvme:
  # Maximum percentage used endurance (0-100, some drives report >100)
  maximum_percentage_used: 100

  # Fallback Available Spare Threshold (%) when the drive omits AVSPT.
  # Real drive AVSPT values are typically 0–12%; prefer the drive value always.
  minimum_available_spare: 10

  # Wear warning tiers (percentage used). Critical still uses maximum_percentage_used.
  wear_warning_moderate: 80
  wear_warning_high: 90
  wear_moderate_deduction: 5
  wear_high_deduction: 10

  # Lifetime composite-temp exposure (SMART 02h WCTT / CCTT), minutes.
  # CCTT > 0 → critical; WCTT > wctt_warning_minutes → warning.
  wctt_warning_minutes: 0
  cctt_critical_minutes: 0

  # OCP SMART Additional Log (C0h) predictive-fail knobs (skipped when C0h absent).
  ocp:
    enabled: true
    # Capacitor Health: FFFFh = no PLP; 100 = factory pass margin (OCP SMART-19).
    capacitor_health_min: 100
    # Bad user NAND normalized starts at 100 (0x64) at factory (SMART-3).
    bad_user_nand_warning: 90
    bad_user_nand_critical: 50
    system_data_used_warning: 90
    incomplete_shutdowns_warning: 10
    thermal_throttle_events_warning: 20

# SCSI/SAS Device Thresholds
scsi:
  # Maximum grown defects before Grade F
  maximum_grown_defects: 10

  # Maximum total uncorrected errors (read + write + verify)
  maximum_uncorrected_errors: 10

# Temperature Thresholds
# Policy (unified in HealthScoreCalculator._check_temperature):
#   1. Prefer drive-reported limits when present:
#        NVMe: Warning/Critical Comp. Temp. Threshold (WCTEMP/CCTEMP)
#        ATA:  Specified Maximum Operating Temperature
#        SCSI: temperature.drive_trip / sensor_critical
#      current_temperature above warning → -5; above critical → -15 (Grade F).
#   2. highest_temperature > drive-reported maximum_temperature (spec limit)
#      → critical deduction (historical excursion fail-gate).
#   3. YAML warning / maximum_operating below are ATA/SCSI fallbacks only.
#      NVMe current-temp scoring uses WCTEMP/CCTEMP when present; when absent it
#      does not apply this YAML ceiling (CW bit 1 + WCTT/CCTT are the gates).
temperature:
  # Fallback maximum operating temperature in Celsius (ATA/SCSI without drive max)
  maximum_operating: 60

  # Fallback warning temperature in Celsius (ATA/SCSI without drive warning)
  warning: 55

# Grading Rules
# Score bands and deduction weights consumed by HealthScoreCalculator.
# Letter grades are derived from the numeric health score after deductions;
# any critical deduction (SMART fail, self-test fail, threshold exceeded, etc.)
# forces Grade F regardless of the remaining numeric score.
grading:
  # SATA/SAS HDD: no deduction at or below this count; linear deduction above until failure threshold
  hdd_sector_concern_threshold: 2
  # Max points deducted per metric (reallocated, pending, or grown defects) at failure (10 sectors/defects)
  hdd_sector_defect_max_deduction_points: 10
  # Beyond failure threshold F: extra deduction per sector (capped), so large pending/reallocated counts grade down
  hdd_sector_excess_points_per_sector: 1
  hdd_sector_excess_cap: 40

  # Minimum numeric score (inclusive) for each letter grade
  grade_bands:
    A: 90
    B: 75
    C: 60
    D: 40
    F: 0

  # Point deductions applied by HealthScoreCalculator
  deductions:
    smart_failure: 50
    per_sector: 5
    threshold_exceeded: 25
    temp_warning: 5
    temp_critical: 15
