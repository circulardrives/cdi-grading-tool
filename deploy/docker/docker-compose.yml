# CDI Health — single Docker Compose stack.
#
# Prefer the wrapper (handles .env + pull):
#   ./scripts/docker-up.sh
#
# Or manually:
#   docker compose -f deploy/docker/docker-compose.yml pull
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# Images default to GHCR :latest. Build from source with:
#   ./scripts/docker-up.sh --build
#
# Proxy the UI at a remote grading bench:
#   ./scripts/docker-up.sh --bench 192.168.0.74
#
# Lab benches without a token (anyone on the LAN can scan):
#   ./scripts/docker-up.sh --no-auth

name: cdi-health

services:
  api:
    image: ghcr.io/circulardrives/cdi-health-api:${CDI_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    pull_policy: ${CDI_PULL_POLICY:-always}
    profiles: ["local"]
    container_name: cdi-health-api
    # The API reports its hostname as the bench name ("This bench"). Without
    # this, Docker uses the random container ID. Set CDI_BENCH_HOSTNAME in
    # deploy/docker/.env to the machine's name (e.g. bench-01).
    hostname: ${CDI_BENCH_HOSTNAME:-cdi-health}
    command:
      [
        "python",
        "-m",
        "cdi_health.api.server",
        "--host",
        "0.0.0.0",
        "--port",
        "8844",
        "--data-dir",
        "/var/lib/cdi-health",
        "--allow-non-root",
      ]
    environment:
      CDI_HEALTH_API_ALLOW_NON_ROOT: "1"
      # Token is required unless lab no-auth mode is on; the API (and the
      # entrypoint) refuse to start on 0.0.0.0 with neither set.
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:-}
      CDI_HEALTH_API_NO_AUTH: ${CDI_HEALTH_API_NO_AUTH:-0}
      CDI_HEALTH_DATA_DIR: /var/lib/cdi-health
    volumes:
      - cdi-api-data:/var/lib/cdi-health
    expose:
      - "8844"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8844/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dashboard:
    image: ghcr.io/circulardrives/cdi-health-dashboard:${CDI_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
      args:
        VITE_CDI_USE_MOCK_DATA: ${VITE_CDI_USE_MOCK_DATA:-0}
        VITE_CDI_MOCK_DATA_PATH: /app/src/cdi_health/mock_data
    pull_policy: ${CDI_PULL_POLICY:-always}
    profiles: ["local"]
    container_name: cdi-health-dashboard
    environment:
      # Empty in no-auth mode: nginx then sends no X-API-Token header.
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Used only by: ./scripts/docker-up.sh --bench <ip>
  dashboard-remote:
    image: ghcr.io/circulardrives/cdi-health-dashboard:${CDI_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
    pull_policy: ${CDI_PULL_POLICY:-always}
    profiles: ["remote"]
    container_name: cdi-health-dashboard
    environment:
      # Empty in no-auth mode: nginx then sends no X-API-Token header.
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./.nginx.remote-bench.generated.conf:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

volumes:
  cdi-api-data:
