# Demo / technician UI without installing Python, bun, or systemd locally.
#
# From the repository root:
#   docker compose -f deploy/docker/docker-compose.yml up --build
#
# Open http://127.0.0.1:3000 — enable **Use mock data** on Discover for fixture demos.
#
# Set CDI_HEALTH_API_TOKEN in deploy/docker/.env (required when the API is
# reachable beyond loopback; nginx injects X-API-Token for the SPA proxy).
#
# For live drive scanning on the Docker host, add the hardware overlay:
#   docker compose -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.hardware.yml up --build

name: cdi-health

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: cdi-health-api
    command:
      [
        "python",
        "-m",
        "cdi_health.api.server",
        "--host",
        "0.0.0.0",
        "--port",
        "8844",
        "--data-dir",
        "/var/lib/cdi-health",
        "--allow-non-root",
      ]
    environment:
      CDI_HEALTH_API_ALLOW_NON_ROOT: "1"
      # Token is mandatory for non-loopback binds (compose publishes via nginx only).
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:?Set CDI_HEALTH_API_TOKEN in .env}
      CDI_HEALTH_DATA_DIR: /var/lib/cdi-health
    volumes:
      - cdi-api-data:/var/lib/cdi-health
    # Do not publish 8844 on the host — reach the API via the dashboard nginx proxy.
    expose:
      - "8844"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8844/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
      args:
        VITE_CDI_USE_MOCK_DATA: ${VITE_CDI_USE_MOCK_DATA:-0}
        VITE_CDI_MOCK_DATA_PATH: /app/src/cdi_health/mock_data
    container_name: cdi-health-dashboard
    environment:
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:?Set CDI_HEALTH_API_TOKEN in .env}
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cdi-api-data:
