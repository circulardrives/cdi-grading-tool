# Overlay: API uses the host network so LAN discovery sees lab interfaces.
# Dashboard shares the API network namespace; nginx listens on port 8080 there.
# dashboard-proxy publishes port 3000 to the Docker host (Mac/Linux).
#
# On macOS Docker Desktop, prefer the bridged LAN discovery stack instead:
#   ./scripts/docker-lan-discover.sh
#
# Requires CDI_HEALTH_API_TOKEN (API binds 0.0.0.0 on the host network).
#
# Linux host-network LAN discovery:
#   CDI_HEALTH_API_TOKEN=... CDI_VERSION=0.9.5 docker compose \
#     -f deploy/docker/docker-compose.ghcr.yml \
#     -f deploy/docker/docker-compose.host.yml up -d
#
# Open http://127.0.0.1:3000 — ensure port 8844 is free on the host.
#
# When switching back to the default bridged stack, use --remove-orphans or:
#   ./scripts/docker-reset.sh

services:
  api:
    network_mode: host
    environment:
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:?Set CDI_HEALTH_API_TOKEN in .env}
    volumes:
      - cdi-api-data:/var/lib/cdi-health

  dashboard:
    network_mode: service:api
    ports: !reset null
    environment:
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:?Set CDI_HEALTH_API_TOKEN in .env}
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./nginx.host.conf.template:/etc/nginx/templates/default.conf.template:ro

  dashboard-proxy:
    image: alpine/socat:latest
    ports: !override
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      dashboard:
        condition: service_started
    command: TCP-LISTEN:3000,fork,reuseaddr TCP:172.17.0.1:8080
