# Overlay: dashboard-only — proxy all API calls to one remote grading bench.
# Skips the local API container. Use when scans must run on the bench itself.
#
# For LAN discovery without hardcoding BENCH_IP, use docker-compose.lan-discover.yml:
#   ./scripts/docker-lan-discover.sh
#
# Pin to one bench (all API traffic, including scans):
#   CDI_HEALTH_API_TOKEN=... BENCH_IP=192.168.0.74 ./scripts/docker-remote-bench.sh
#
# Or manually:
#   BENCH_IP=192.168.0.74 sed "s/__BENCH_HOST__/192.168.0.74/g" \
#     deploy/docker/nginx.remote-bench.conf.template \
#     > deploy/docker/.nginx.remote-bench.generated.conf
#   CDI_HEALTH_API_TOKEN=... CDI_VERSION=0.9.5 docker compose \
#     -f deploy/docker/docker-compose.ghcr.yml \
#     -f deploy/docker/docker-compose.remote-bench.yml up -d
#
# The generated conf is mounted as an nginx template so ${CDI_HEALTH_API_TOKEN}
# is substituted at container start (never baked into the SPA).

services:
  api:
    profiles:
      - local-mock-api

  dashboard:
    depends_on: !reset []
    environment:
      CDI_HEALTH_API_TOKEN: ${CDI_HEALTH_API_TOKEN:?Set CDI_HEALTH_API_TOKEN in .env}
    ports: !override
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./.nginx.remote-bench.generated.conf:/etc/nginx/templates/default.conf.template:ro
