# Overlay: dashboard-only — proxy all API calls to a remote grading bench.
# Skips the local mock API container (Mac Docker host networking cannot scan the lab LAN).
#
#   BENCH_IP=192.168.0.74 ./scripts/docker-remote-bench.sh
#
# Or manually:
#   BENCH_IP=192.168.0.74 sed "s/__BENCH_HOST__/192.168.0.74/g" \
#     deploy/docker/nginx.remote-bench.conf.template \
#     > deploy/docker/.nginx.remote-bench.generated.conf
#   CDI_VERSION=0.9.4 docker compose \
#     -f deploy/docker/docker-compose.ghcr.yml \
#     -f deploy/docker/docker-compose.remote-bench.yml up -d

services:
  api:
    profiles:
      - local-mock-api

  dashboard:
    depends_on: !reset []
    ports: !override
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./.nginx.remote-bench.generated.conf:/etc/nginx/conf.d/default.conf:ro
