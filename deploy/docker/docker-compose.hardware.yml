# Overlay for scanning drives attached to the Docker host.
# Requires Linux, root in the API container, and access to block devices.
#
#   docker compose -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.hardware.yml up --build
#
# Rebuild the dashboard with live-scan defaults:
#   VITE_CDI_USE_MOCK_DATA=0 docker compose -f deploy/docker/docker-compose.yml \
#     -f deploy/docker/docker-compose.hardware.yml up --build

services:
  api:
    user: "0:0"
    privileged: true
    environment:
      CDI_HEALTH_API_ALLOW_NON_ROOT: "0"
      CDI_HEALTH_API_MOCK_DATA: ""
    command:
      [
        "python",
        "-m",
        "cdi_health.api.server",
        "--host",
        "0.0.0.0",
        "--port",
        "8844",
        "--data-dir",
        "/var/lib/cdi-health",
      ]
    volumes:
      - cdi-api-data:/var/lib/cdi-health
      - /dev:/dev
      - /run/udev:/run/udev:ro

  dashboard:
    build:
      args:
        VITE_CDI_USE_MOCK_DATA: ${VITE_CDI_USE_MOCK_DATA:-0}
