[Service]
# Optional drop-in for trusted lab LANs only.
# Copy to /etc/systemd/system/cdi-health-api.service.d/lan.conf
#
#   sudo mkdir -p /etc/systemd/system/cdi-health-api.service.d
#   sudo cp deploy/systemd/cdi-health-api.service.d/lan.conf \
#     /etc/systemd/system/cdi-health-api.service.d/lan.conf
#   sudo cp deploy/systemd/cdi-health-api.env.example /etc/default/cdi-health-api
#   # edit /etc/default/cdi-health-api and set CDI_HEALTH_API_TOKEN
#   sudo systemctl daemon-reload && sudo systemctl restart cdi-health-api
#
# Requires EnvironmentFile with CDI_HEALTH_API_TOKEN (no leading '-').

EnvironmentFile=/etc/default/cdi-health-api
ExecStart=
ExecStart=/usr/local/bin/cdi-health-api --host 0.0.0.0 --port 8844 --data-dir /var/lib/cdi-health
